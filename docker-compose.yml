services:
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: "123456", MYSQL_DATABASE: smart_mes }
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./sql:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h localhost -p123456"], interval: 10s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }
  rabbitmq:
    image: rabbitmq:3.13-management
    environment: { RABBITMQ_DEFAULT_USER: guest, RABBITMQ_DEFAULT_PASS: guest }
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 15s, timeout: 10s, retries: 10 }
volumes: { mysql_data: {}, redis_data: {}, rabbitmq_data: {} }
